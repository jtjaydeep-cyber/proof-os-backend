<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proof OS - Autonomous Work Verification</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-green: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 15px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    h1 { color: var(--accent); margin: 0 0 5px 0; font-size: 1.6rem; }
    p { color: var(--text-muted); margin: 0; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow: hidden; }
    .card h2 { margin-top: 0; font-size: 1.1rem; color: var(--accent); }
    label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 8px; }
    input, select, button {
      width: 100%; padding: 10px; margin-top: 4px;
      border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff;
      font-size: 0.9rem;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 12px; }
    button { background: #0284c7; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
    button:hover { background: var(--accent); color: #000; }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; color: #fff; }
    
    .status-msg { margin-top: 10px; font-size: 0.8rem; padding: 8px; border-radius: 4px; word-break: break-word; display: none; }
    .success { background: rgba(34, 197, 94, 0.1); border: 1px solid var(--accent-green); color: var(--accent-green); display: block; }
    .error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; display: block; }
    
    /* Mobile-Proof Certificate Box */
    .cert-box {
      border: 2px solid var(--accent-green); background: rgba(34, 197, 94, 0.03);
      border-radius: 8px; padding: 15px; margin-top: 12px; text-align: center; width: 100%;
    }
    .cert-header { font-size: 1.1rem; font-weight: bold; color: var(--accent-green); }
    .cert-score { font-size: 2.2rem; font-weight: bold; color: var(--accent); margin: 8px 0; }
    .cert-details { font-size: 0.85rem; word-break: break-word; margin: 4px 0; }
    pre {
      background: #090d16; padding: 10px; border-radius: 6px; overflow-x: auto;
      font-size: 0.75rem; text-align: left; white-space: pre-wrap; word-break: break-all;
    }
    .match-item { border-bottom: 1px solid var(--border); padding: 8px 0; font-size: 0.85rem; word-break: break-word; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ Proof OS Portal</h1>
      <p>Submit work, get AI-verified, and issue shareable certificates.</p>
    </header>

    <div class="grid">
      <!-- 1. Registration / Login -->
      <div class="card">
        <h2>👤 Step 1: Creator Portal</h2>
        <label>Your Email Address:</label>
        <input type="email" id="regEmail" placeholder="developer@example.com">
        
        <div class="btn-group">
          <button onclick="registerUser()">Create Account</button>
          <button onclick="loginUser()" class="btn-secondary">Login Existing</button>
        </div>
        
        <div id="regMsg" class="status-msg"></div>
      </div>

      <!-- 2. Submission -->
      <div class="card">
        <h2>🔗 Step 2: Submit Work Link</h2>
        <label>User ID:</label>
        <input type="text" id="subUserId" placeholder="Paste User UUID">
        
        <label>Work Title:</label>
        <input type="text" id="subTitle" placeholder="e.g. Built Distributed Lock / Portfolio">
        
        <label>Platform / Class:</label>
        <select id="subEClass">
          <option value="CLASS_C">GitHub PR / Code Commit (Class C)</option>
          <option value="CLASS_B">X / Twitter Thread / Article (Class B)</option>
          <option value="CLASS_A">Personal Website / Portfolio (Class A)</option>
        </select>

        <label>Link (URL):</label>
        <input type="url" id="subSourceUri" placeholder="https://github.com/... or https://x.com/...">

        <button onclick="submitWork()">Run AI Analysis & Store Work</button>
        <div id="subMsg" class="status-msg"></div>
      </div>
    </div>

    <div class="grid">
      <!-- 3. Certificate Inspection -->
      <div class="card">
        <h2>🛡️ Step 3: Verified Certificate</h2>
        <label>User ID:</label>
        <input type="text" id="certUserId" placeholder="Enter User UUID">
        <button onclick="generateCertificate()">View Certificate</button>
        <div id="certDisplay"></div>
      </div>

      <!-- 4. Matcher Engine -->
      <div class="card">
        <h2>🎯 Candidate Skill Matcher</h2>
        <label>Vector Space (Systems, DevRel, Design):</label>
        <input type="text" id="matchVector" value="0.8, 0.2, 0.1">
        <button onclick="searchCandidates()">Search Candidates</button>
        <div id="matchResults" style="margin-top: 10px;"></div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = 'proof_os_secret_key_2026';

    // 1A. Register New User
    async function registerUser() {
      const email = document.getElementById('regEmail').value.trim();
      const msg = document.getElementById('regMsg');
      if (!email) return showMsg(msg, 'Please enter a valid email', false);

      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
          body: JSON.stringify({ email, identityTrustLevel: 'LEVEL_1' })
        });
        const data = await res.json();
        
        if (data.success) {
          showMsg(msg, `Account Created! User ID: ${data.user.id}`, true);
          document.getElementById('subUserId').value = data.user.id;
          document.getElementById('certUserId').value = data.user.id;
        } else {
          const userFriendlyMsg = data.error?.includes('unique constraint') 
            ? 'Email already registered! Click "Login Existing" to access your dashboard.' 
            : (data.error || 'Registration failed');
          showMsg(msg, userFriendlyMsg, false);
        }
      } catch (err) { showMsg(msg, err.message, false); }
    }

    // 1B. Login Existing User
    async function loginUser() {
      const email = document.getElementById('regEmail').value.trim();
      const msg = document.getElementById('regMsg');
      if (!email) return showMsg(msg, 'Please enter your email to log in', false);

      try {
        const res = await fetch(`/api/users/lookup?email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (data.success && data.user) {
          showMsg(msg, `Welcome back! Logged in as User ID: ${data.user.id}`, true);
          document.getElementById('subUserId').value = data.user.id;
          document.getElementById('certUserId').value = data.user.id;
          
          // Automatically load certificate on login
          generateCertificate();
        } else {
          showMsg(msg, 'No account found with this email. Please click "Create Account".', false);
        }
      } catch (err) { showMsg(msg, err.message, false); }
    }

    // 2. Submit Work Link
    async function submitWork() {
      const userId = document.getElementById('subUserId').value.trim();
      const title = document.getElementById('subTitle').value.trim();
      const eClass = document.getElementById('subEClass').value;
      const sourceUri = document.getElementById('subSourceUri').value.trim();
      const msg = document.getElementById('subMsg');

      if (!userId || !title || !sourceUri) return showMsg(msg, 'Please fill all fields', false);

      try {
        const res = await fetch('/api/evidence', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
          body: JSON.stringify({ userId, title, eClass, sourceUri })
        });
        const data = await res.json();

        if (!data.success) return showMsg(msg, data.error, false);

        await fetch('/api/users/aggregate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
          body: JSON.stringify({ userId })
        });

        showMsg(msg, `✅ AI Analysis Complete! Score: ${(data.aiAnalysis.calculatedScore * 100).toFixed(0)}% | Vector: [${data.aiAnalysis.generatedVector.join(', ')}]`, true);
      } catch (err) { showMsg(msg, err.message, false); }
    }

    // 3. Generate Certificate
    async function generateCertificate() {
      const userId = document.getElementById('certUserId').value.trim();
      const container = document.getElementById('certDisplay');
      if (!userId) return alert('Enter a User ID');

      const res = await fetch(`/api/users/${userId}/badge`);
      const data = await res.json();

      if (!data.success) {
        container.innerHTML = `<p style="color: red;">${data.error || 'Not found'}</p>`;
        return;
      }

      const b = data.badge;
      container.innerHTML = `
        <div class="cert-box">
          <div class="cert-header">🏆 VERIFIED PROOF CERTIFICATE</div>
          <div class="cert-details">Issued to: <strong>${b.verifiedIdentity}</strong></div>
          <div class="cert-score">${b.proofScore} <span style="font-size: 0.9rem; color: #fff;">PTS</span></div>
          <div class="cert-details">Trust: <strong>${b.trustLevel}</strong> | Confidence: <strong>${b.confidenceRating}</strong></div>
          <pre>${JSON.stringify(b.evidence, null, 2)}</pre>
        </div>
      `;
    }

    // 4. Candidate Matcher
    async function searchCandidates() {
      const vecStr = document.getElementById('matchVector').value;
      const queryVector = vecStr.split(',').map(n => parseFloat(n.trim()));

      const res = await fetch('/api/match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
        body: JSON.stringify({ queryVector, matchThreshold: 0.5 })
      });
      const data = await res.json();

      const container = document.getElementById('matchResults');
      if (!data.success || data.matches.length === 0) {
        container.innerHTML = '<p>No matching candidate vectors found.</p>';
        return;
      }

      container.innerHTML = data.matches.map(m => `
        <div class="match-item">
          <strong>${m.title}</strong> (${m.email})<br>
          <span style="color: var(--accent-green)">Similarity: ${(m.similarity_score * 100).toFixed(2)}%</span> | Trust: ${m.identityTrustLevel}
        </div>
      `).join('');
    }

    function showMsg(el, text, isSuccess) {
      el.innerText = text;
      el.className = 'status-msg ' + (isSuccess ? 'success' : 'error');
    }
  </script>
</body>
</html>
