<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proof OS – Identity & Capability Verification Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-2xl w-full space-y-6 my-8">
    <!-- Header -->
    <div class="text-center space-y-2">
      <h1 class="text-4xl font-extrabold tracking-tight text-sky-400">Proof OS</h1>
      <p class="text-slate-400 text-sm">Cryptographic Identity & Work Capability Verification Engine</p>
    </div>

    <!-- Auth / Session Card -->
    <div class="glass p-6 rounded-xl shadow-xl space-y-4">
      <h2 class="text-xl font-bold text-slate-200">Dashboard Authentication</h2>
      
      <div id="authNotice" class="hidden p-3 rounded-lg text-xs font-medium"></div>

      <form id="magicLinkForm" class="flex gap-2">
        <input type="email" id="authEmail" placeholder="Enter your email address" required 
               class="flex-1 bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500" />
        <button type="submit" class="bg-sky-500 hover:bg-sky-600 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition">
          Send Magic Link
        </button>
      </form>

      <div id="userInfo" class="hidden text-xs text-slate-400 border-t border-slate-800 pt-3 flex justify-between items-center">
        <span>Logged in as: <strong id="loggedInEmail" class="text-sky-300"></strong></span>
        <button onclick="logout()" class="text-red-400 hover:underline">Log Out</button>
      </div>
    </div>

    <!-- Tier Selection & Checkout Card -->
    <div class="glass p-6 rounded-xl shadow-xl space-y-4">
      <h2 class="text-xl font-bold text-slate-200">Select Verification Level</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Choose Plan / Option</label>
          <select id="checkoutType" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
            <option value="FREE_TIER">Free Candidate Verification (Level 1 - ₹0)</option>
            <option value="CERTIFICATE">Pro Identity & Badge Upgrade (Level 3 - ₹199)</option>
            <option value="JOB_POSTING">Post Verified Job Opportunity (Employer - ₹4,999)</option>
          </select>
        </div>
        <button id="actionBtn" onclick="handleSelection()" class="w-full bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold py-2 rounded-lg text-sm transition">
          Proceed
        </button>
      </div>
    </div>

    <!-- Active Job Opportunities Feed -->
    <div class="glass p-6 rounded-xl shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-slate-200">Active Verified Job Listings</h2>
        <button onclick="fetchJobs()" class="text-xs text-sky-400 hover:underline">Refresh</button>
      </div>
      <div id="jobList" class="space-y-3">
        <p class="text-slate-500 text-xs italic">Loading job listings...</p>
      </div>
    </div>

    <!-- User Evidence & Artifacts List -->
    <div class="glass p-6 rounded-xl shadow-xl space-y-4">
      <h2 class="text-xl font-bold text-slate-200">Your Verified Credentials & Evidence</h2>
      <div id="certList" class="space-y-3">
        <p class="text-slate-500 text-xs italic">Log in via magic link to view your dashboard credentials.</p>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const urlToken = urlParams.get('auth_token');
    if (urlToken) {
      localStorage.setItem('proof_jwt', urlToken);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    let authToken = localStorage.getItem('proof_jwt');

    document.getElementById('magicLinkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const notice = document.getElementById('authNotice');

      notice.className = "p-3 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 block";
      notice.innerText = "Requesting magic link...";

      try {
        const res = await fetch('/api/auth/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem('proof_jwt', data.token);
          localStorage.setItem('proof_user_email', email);
          authToken = data.token;
          notice.className = "p-3 rounded-lg text-xs font-medium bg-emerald-950 text-emerald-300 border border-emerald-800 block";
          notice.innerText = "Authenticated successfully!";
          fetchUserCertificates();
        } else {
          notice.className = "p-3 rounded-lg text-xs font-medium bg-red-950 text-red-300 border border-red-800 block";
          notice.innerText = data.error || 'Failed to authenticate.';
        }
      } catch (err) {
        notice.className = "p-3 rounded-lg text-xs font-medium bg-red-950 text-red-300 border border-red-800 block";
        notice.innerText = "Network error while requesting authentication.";
      }
    });

    async function handleSelection() {
      if (!authToken) {
        alert('Please log in via Magic Link first!');
        return;
      }

      const type = document.getElementById('checkoutType').value;

      if (type === 'FREE_TIER') {
        alert('Free Tier Activated! You can now view opportunities and upload basic proof artifacts.');
        fetchUserCertificates();
        return;
      }

      try {
        const res = await fetch('/api/checkout/create-session', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            type,
            opportunityData: type === 'JOB_POSTING' ? {
              title: "Senior Full Stack Engineer",
              company: "TechCorp",
              requiredEClass: "ENGINEERING_E4",
              minTrustLevel: "LEVEL_3_VERIFIED"
            } : null
          })
        });

        const orderData = await res.json();

        if (!orderData.orderId) {
          alert('Failed to initialize checkout session.');
          return;
        }

        const options = {
          key: orderData.keyId,
          amount: orderData.amount,
          currency: orderData.currency,
          name: "Proof OS Engine",
          description: type === 'CERTIFICATE' ? "Pro Identity Upgrade" : "Job Posting",
          order_id: orderData.orderId,
          handler: function (response) {
            alert('Payment Successful! ID: ' + response.razorpay_payment_id);
            fetchUserCertificates();
            fetchJobs();
          },
          theme: { color: "#0284c7" }
        };

        const rzp = new Razorpay(options);
        rzp.open();
      } catch (err) {
        alert('Checkout encountered a network error.');
      }
    }

    async function fetchJobs() {
      const container = document.getElementById('jobList');
      try {
        const res = await fetch('/api/opportunities');
        const jobs = await res.json();

        if (!Array.isArray(jobs) || jobs.length === 0) {
          container.innerHTML = '<p class="text-slate-500 text-xs italic">No active job listings found at the moment.</p>';
          return;
        }

        container.innerHTML = jobs.map(j => `
          <div class="bg-slate-900 border border-slate-700 p-4 rounded-lg flex justify-between items-center">
            <div>
              <h3 class="text-sky-400 font-bold text-sm">${j.title || 'Untitled Opportunity'}</h3>
              <p class="text-slate-400 text-xs">Company: <span class="text-slate-200">${j.company || 'Verified Recruiter'}</span></p>
              <div class="flex gap-2 mt-2">
                <span class="bg-slate-800 border border-slate-700 text-slate-300 text-[10px] px-2 py-0.5 rounded">
                  Class: ${j.requiredEClass || 'ANY'}
                </span>
                <span class="bg-emerald-950 border border-emerald-800 text-emerald-300 text-[10px] px-2 py-0.5 rounded">
                  Min Level: ${j.minTrustLevel || 'LEVEL_1'}
                </span>
              </div>
            </div>
            <button onclick="alert('Application submitted using your verified Proof OS profile!')" class="bg-sky-500 hover:bg-sky-600 text-slate-950 font-semibold px-3 py-1 rounded text-xs transition">
              Apply Now
            </button>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p class="text-red-400 text-xs">Unable to load job listings.</p>';
      }
    }

    async function fetchUserCertificates() {
      if (!authToken) return;

      try {
        const res = await fetch('/api/evidence/user/me', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();

        if (data.artifacts) {
          document.getElementById('userInfo').classList.remove('hidden');
          document.getElementById('loggedInEmail').innerText = localStorage.getItem('proof_user_email') || 'User';
          renderCertificates(data.artifacts);
        }
      } catch (err) {
        console.error('Failed to load certificates:', err);
      }
    }

    function renderCertificates(certs) {
      const list = document.getElementById('certList');
      if (!certs || certs.length === 0) {
        list.innerHTML = '<p class="text-slate-400 text-xs">No evidence artifacts recorded yet.</p>';
        return;
      }

      list.innerHTML = certs.map(c => `
        <div class="bg-slate-900 border border-slate-700 p-4 rounded-lg space-y-2">
          <h3 class="text-sky-400 font-bold text-sm">${c.title}</h3>
          <p class="text-slate-400 text-xs">Class: <strong>${c.eClass}</strong></p>
          <p class="text-slate-500 text-xs truncate">Source: ${c.sourceUri}</p>
        </div>
      `).join('');
    }

    function logout() {
      localStorage.removeItem('proof_jwt');
      localStorage.removeItem('proof_user_email');
      window.location.href = '/';
    }

    // Initial Load
    fetchJobs();
    if (authToken) {
      fetchUserCertificates();
    }
  </script>
</body>
</html>
